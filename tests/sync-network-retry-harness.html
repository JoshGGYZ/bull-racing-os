<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>pending</title></head>
<body>
<script>
    localStorage.clear();
    let state = { members: [{ id: 'm1', name: 'Teste de rede', points: 0 }], activities: [], finances: [], sales: [], schedule: {} };
    window.saveState = function () {};
    window.exportData = function () {};
    window.BULL_CONFIG = { supabaseUrl: 'https://test.supabase.co', supabaseAnonKey: 'test-anon-key', teamSlug: 'bull-racing', syncDebounceMs: 5, remotePollMs: 60000 };
    const session = { access_token: 'token-1', user: { id: 'user-1', email: 'capitao@example.com' } };
    let saveAttempts = 0;
    const fakeClient = {
        auth: {
            onAuthStateChange() { return { data: { subscription: { unsubscribe() {} } } }; },
            async getSession() { return { data: { session }, error: null }; }
        },
        from(table) {
            return {
                select() { return this; },
                eq() { return this; },
                async maybeSingle() {
                    if (table === 'profiles') return { data: { id: 'user-1', role: 'admin', active: true }, error: null };
                    return { data: null, error: null };
                }
            };
        },
        rpc() {
            return {
                async single() {
                    saveAttempts += 1;
                    if (saveAttempts < 3) throw new TypeError('NetworkError when attempting to fetch resource');
                    return { data: { saved: true, new_version: 1, current_version: 1 }, error: null };
                }
            };
        }
    };
    window.supabase = { createClient() { return fakeClient; } };
</script>
<script src="../shared-sync.js"></script>
<script>
    window.addEventListener('load', function () {
        setTimeout(function () {
            const status = window.BullCloud.getStatus();
            const ok = saveAttempts === 3 && status.remoteVersion === 1 && status.pendingPush === false && status.saving === false;
            document.title = ok ? 'NETWORK_RETRY_TEST_PASS' : 'NETWORK_RETRY_TEST_FAIL';
            document.body.dataset.result = ok ? 'pass' : 'fail';
            document.body.dataset.details = JSON.stringify({ status, saveAttempts });
        }, 3400);
    });
</script>
</body>
</html>
